<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- الشريط الأخضر -->
    <aside class="sidebar">
      <div class="tabs">
        <a href="#" class="tab active">Login</a>
        <a href="#" class="tab">Signup</a>
      </div>
    </aside>

    <!-- القسم الأبيض -->
    <main class="content">
      <h1 class="logo">LOGO</h1>

      <form>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email Address"
          aria-label="Email Address"
          required
        />
        <input
          type="password"
          id="pwd"
          name="pwd"
          placeholder="Password"
          aria-label="Password"
          required
        />
        <input type="submit" value="Get Started" />
      </form>

      <!-- خط ، نقطة ، خط -->
      <div class="divider">
        <span class="line"></span>
        <span class="dot"></span>
        <span class="line"></span>
      </div>
    </main>
  </body>
</html>
